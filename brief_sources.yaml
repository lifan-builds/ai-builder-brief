version: 1
description: Source catalog for the daily AI news brief, aligned with practitioner engineering feeds and machine-readable endpoints.

policy:
  storage: metadata_only
  reddit: discovery_only
  social: discovery_only
  newsletters: discovery_only
  paywalls: do_not_bypass

roles:
  primary: Official or directly authored factual evidence, code, release notes, advisories, and papers.
  independent: Original practitioner analysis, empirical benchmarks, criticism, or reporting that adds verifiable context.
  adoption: Time-bounded usage, ecosystem, or benchmark measurements with explicit units.
  discovery: Community and search leads (including Algolia HN) that require primary or independent artifact verification.

coverage_lanes:
  models_and_apis:
    - openai_news
    - anthropic_news
    - deepmind_blog
    - google_ai
    - meta_ai
    - mistral_news
    - deepseek_news
    - qwen_docs
    - provider_docs
    - provider_changelogs
  developer_tools_and_agents:
    - claude_dev_blog
    - cursor_blog
    - github_changelog
    - github_releases
    - huggingface_blog
    - simon_willison
    - latent_space
    - github_activity
    - hacker_news
  infrastructure_and_economics:
    - cloudflare_ai
    - together_ai
    - provider_docs
    - provider_status
    - provider_changelogs
    - openrouter_rankings
    - artificial_analysis
    - epoch_ai
    - semianalysis
  research_and_evaluation:
    - hf_daily_papers
    - arxiv_ai
    - anthropic_research
    - google_research
    - eval_methodology
    - interconnects
    - ahead_of_ai
    - simon_willison
  security_and_policy:
    - osv_github_advisories
    - cisa_kev
    - security_research
    - policy_primary
    - ars
    - techcrunch
  builder_behavior:
    - hacker_news
    - github_activity
    - huggingface_models
    - openrouter_rankings
    - package_ecosystem
    - npm_usage
    - ithome_ai
    - community_discovery
    - reddit_local_llama

