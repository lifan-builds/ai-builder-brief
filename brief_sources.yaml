version: 1
description: Source catalog for the daily AI news brief. This is separate from the podcast collector configuration.

policy:
  storage: metadata_only
  reddit: discovery_only
  social: discovery_only
  newsletters: discovery_only
  paywalls: do_not_bypass

roles:
  primary: Official or directly authored factual evidence.
  independent: Reporting, analysis, criticism, or replication that adds useful context.
  adoption: Time-bounded usage, ecosystem, or benchmark measurements.
  discovery: Leads that require stronger evidence before qualification.

coverage_lanes:
  models_and_apis:
    - openai_news
    - anthropic_news
    - google_ai
    - meta_ai
    - mistral_news
    - deepseek_news
    - qwen_modelscope
    - provider_docs
  developer_tools_and_agents:
    - github_releases
    - huggingface_blog
    - practitioner_engineering
    - github_activity
    - hacker_news
  infrastructure_and_economics:
    - provider_docs
    - provider_status
    - provider_changelogs
    - openrouter_rankings
    - artificial_analysis
    - epoch_ai
    - infrastructure_reporting
  research_and_evaluation:
    - arxiv_ai
    - research_labs
    - eval_methodology
    - practitioner_engineering
  security_and_policy:
    - cisa_kev
    - osv_github_advisories
    - security_research
    - policy_primary
    - independent_reporting
  builder_behavior:
    - github_activity
    - huggingface_models
    - openrouter_rankings
    - package_ecosystem
    - npm_usage
    - chinese_technical
    - community_discovery
    - reddit_local_llama

sources:
  - {id: openai_news, name: OpenAI News, role: primary, language: en, url: https://openai.com/news/}
  - {id: anthropic_news, name: Anthropic News, role: primary, language: en, url: https://www.anthropic.com/news}
  - {id: google_ai, name: Google AI and DeepMind, role: primary, language: en, url: https://blog.google/technology/ai/}
