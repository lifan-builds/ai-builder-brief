[project]
name = "ai-builder-brief"
version = "0.1.0"
description = "Source-transparent daily AI briefing powered by CastForge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "castforge[notebooklm,r2] @ git+https://github.com/lifan-builds/castforge.git@v0.1.1",
  "PyYAML>=6",
  "certifi>=2024.8",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1"]
test = ["pytest>=8"]

[project.scripts]
ai-builder-brief = "ai_builder_brief.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
