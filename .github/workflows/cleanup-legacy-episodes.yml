name: cleanup-legacy-episodes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-r2-audio:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: https://28cb5fbc371569c6b3f3280983588c0a.r2.cloudflarestorage.com
    steps:
      - name: Install R2 client
        run: python -m pip install boto3

      - name: Delete exact legacy objects
        shell: bash
        run: |
          python - <<'PY'
          import os

          import boto3
          from botocore.exceptions import ClientError

          bucket = "ai-builder-brief"
          keys = (
              "episodes/ai-builder-brief_2026-08-05.mp3",
              "episodes/ai-builder-brief_2026-08-11.mp3",
          )
          client = boto3.client(
              "s3",
              endpoint_url=os.environ["R2_ENDPOINT_URL"],
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )

          for key in keys:
              before = client.head_object(Bucket=bucket, Key=key)
              print(f"deleting {key} ({before['ContentLength']} bytes)")
              client.delete_object(Bucket=bucket, Key=key)
              try:
                  client.head_object(Bucket=bucket, Key=key)
              except ClientError as error:
                  code = str(error.response.get("Error", {}).get("Code", ""))
                  if code in {"404", "NoSuchKey", "NotFound"}:
                      print(f"verified absent: {key}")
                      continue
                  raise
              raise RuntimeError(f"R2 object still exists after deletion: {key}")
          PY
