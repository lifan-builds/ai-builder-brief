name: daily-ai-brief

on:
  schedule:
    # GitHub cron is UTC. Each entry is identifiable so a delayed runner can
    # evaluate the slot that triggered it instead of its current local hour.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      episode_date:
        description: Episode date to generate; blank uses today's Pacific date
        type: string
        default: ""
      shadow:
        description: Generate a private shadow episode without R2/RSS publication
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-builder-brief-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macos]
    env:
      PY: .venv/bin/python
      NOTEBOOKLM_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_NOTEBOOK_ID }}
      NOTEBOOKLM_AUDIO_LANGUAGE: en
      NOTEBOOKLM_AUDIO_LENGTH: default
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WHISPER_MODEL: small.en
      CLIPROXYAPI_URL: http://127.0.0.1:8317
      CLIPROXYAPI_USAGE_GATE_COMMAND: ${{ vars.CLIPROXYAPI_USAGE_GATE_COMMAND }}
      EDITORIAL_MODEL: gpt-5.6-terra
    steps:
      - uses: actions/checkout@v5

      - name: Select Pacific attempt window
        id: pacific_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "shadow=${{ inputs.shadow == true }}" >> "$GITHUB_OUTPUT"
            if [ -n "${{ inputs.episode_date }}" ]; then
              echo "episode_date=${{ inputs.episode_date }}" >> "$GITHUB_OUTPUT"
            else
              echo "episode_date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$PUBLICATION_ENABLED" = "true" ]; then
            SLOT_OUTPUT="$(python3 scripts/select_schedule_slot.py --cron "$SCHEDULE_CRON" --date "$(date -u +%F)" --publication-enabled)"
            while IFS='=' read -r key value; do
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            done <<< "$SLOT_OUTPUT"
          else
            SLOT_OUTPUT="$(python3 scripts/select_schedule_slot.py --cron "$SCHEDULE_CRON" --date "$(date -u +%F)")"
            while IFS='=' read -r key value; do
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            done <<< "$SLOT_OUTPUT"
          fi

      - name: Install pinned pipeline
        if: steps.pacific_window.outputs.run == 'true'
        run: |
          if [ ! -x .venv/bin/python ]; then python3 -m venv .venv; fi
          $PY -m pip install -q -e ".[transcription]"

      - name: Run daily episode
        id: episode
        if: steps.pacific_window.outputs.run == 'true'
        run: |
          FLAGS=""
          # Manual inputs remain explicit; scheduled runs use the helper's
          # intended slot date even when the runner started late.
          EPISODE_DATE="${{ steps.pacific_window.outputs.episode_date }}"
          if [ -z "$EPISODE_DATE" ]; then EPISODE_DATE="${{ inputs.episode_date }}"; fi
          if [ -z "$EPISODE_DATE" ]; then EPISODE_DATE="$(TZ=America/Los_Angeles date +%F)"; fi
          if [ "${{ steps.pacific_window.outputs.shadow }}" = "true" ]; then FLAGS="--shadow"; fi
          STATUS="$(caffeinate -dimsu "$PY" -m ai_builder_brief run --date "$EPISODE_DATE" $FLAGS)"
          echo "$STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Validate public artifacts
        if: steps.pacific_window.outputs.run == 'true' && steps.pacific_window.outputs.shadow != 'true' && steps.episode.outputs.status == 'published'
        run: |
          EPISODE_DATE="${{ steps.pacific_window.outputs.episode_date }}"
          if [ -z "$EPISODE_DATE" ]; then EPISODE_DATE="${{ inputs.episode_date }}"; fi
          if [ -z "$EPISODE_DATE" ]; then EPISODE_DATE="$(TZ=America/Los_Angeles date +%F)"; fi
          $PY -m ai_builder_brief validate --date "$EPISODE_DATE" --check-public

      - name: Commit source-transparent publication
        if: steps.pacific_window.outputs.run == 'true' && steps.pacific_window.outputs.shadow != 'true' && steps.episode.outputs.status == 'published'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish AI Builder Brief ${{ steps.pacific_window.outputs.episode_date }}"
            git push
          fi

      - name: Retain run artifacts
        if: always() && steps.pacific_window.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ai-builder-brief-${{ github.run_id }}
          path: build/
          if-no-files-found: warn
