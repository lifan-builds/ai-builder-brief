name: daily-ai-brief

on:
  schedule:
    # GitHub cron is UTC. Cover both PST and PDT, then keep only 06/08/10 local.
    - cron: "0 13-18 * * *"
  workflow_dispatch:
    inputs:
      shadow:
        description: Generate a private shadow episode without R2/RSS publication
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-builder-brief-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, macos]
    env:
      PY: .venv/bin/python
      NOTEBOOKLM_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_NOTEBOOK_ID }}
      NOTEBOOKLM_AUDIO_LANGUAGE: en
      NOTEBOOKLM_AUDIO_LENGTH: default
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      WHISPER_MODEL: small.en
      CLIPROXYAPI_URL: http://127.0.0.1:8317
      CLIPROXYAPI_USAGE_GATE_COMMAND: ${{ vars.CLIPROXYAPI_USAGE_GATE_COMMAND }}
      EDITORIAL_MODEL: gpt-5.6-terra
    steps:
      - name: Select Pacific attempt window
        id: pacific_window
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLICATION_ENABLED: ${{ vars.PUBLICATION_ENABLED }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "shadow=${{ inputs.shadow == true }}" >> "$GITHUB_OUTPUT"
          elif [ "$PUBLICATION_ENABLED" = "true" ]; then
            case "$(TZ=America/Los_Angeles date +%H)" in
              06|08|10) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "shadow=false" >> "$GITHUB_OUTPUT"
          else
            case "$(TZ=America/Los_Angeles date +%H)" in
              06) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "shadow=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.pacific_window.outputs.run == 'true'

      - name: Install pinned pipeline
        if: steps.pacific_window.outputs.run == 'true'
        run: |
          if [ ! -x .venv/bin/python ]; then python3 -m venv .venv; fi
          $PY -m pip install -q -e ".[transcription]"

      - name: Run daily episode
        id: episode
        if: steps.pacific_window.outputs.run == 'true'
        run: |
          FLAGS=""
          if [ "${{ steps.pacific_window.outputs.shadow }}" = "true" ]; then FLAGS="--shadow"; fi
          STATUS="$($PY -m ai_builder_brief run --date "$(TZ=America/Los_Angeles date +%F)" $FLAGS)"
          echo "$STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Validate public artifacts
        if: steps.pacific_window.outputs.run == 'true' && steps.pacific_window.outputs.shadow != 'true' && steps.episode.outputs.status == 'published'
        run: $PY -m ai_builder_brief validate --date "$(TZ=America/Los_Angeles date +%F)" --check-public

      - name: Commit source-transparent publication
        if: steps.pacific_window.outputs.run == 'true' && steps.pacific_window.outputs.shadow != 'true' && steps.episode.outputs.status == 'published'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish AI Builder Brief $(TZ=America/Los_Angeles date +%F)"
            git push
          fi

      - name: Retain run artifacts
        if: always() && steps.pacific_window.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ai-builder-brief-${{ github.run_id }}
          path: build/
          if-no-files-found: warn
