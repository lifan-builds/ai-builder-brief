name: publish-review-feed

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release containing the reviewed MP3s
        required: true
        default: review-2026-08-11

permissions:
  contents: read

jobs:
  publish-audio:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned CastForge
        run: python -m pip install "castforge[r2]==0.1.1"

      - name: Download immutable review audio
        run: |
          mkdir review-source review-audio
          gh release download "${{ inputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'ai-builder-brief_*.m4a' \
            --dir review-source

      - name: Transcode reviewed audio to real MP3
        run: |
          for source in review-source/*.m4a; do
            filename="$(basename "$source" .m4a).mp3"
            ffmpeg -v error -i "$source" -codec:a libmp3lame -q:a 2 "review-audio/$filename"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "review-audio/$filename")" = "mp3"
          done

      - name: Upload and validate R2 audio
        run: |
          python - <<'PY'
          from pathlib import Path

          from castforge.publishers.r2 import R2Publisher

          publisher = R2Publisher.from_env(
              bucket="ai-builder-brief",
              endpoint_url="https://28cb5fbc371569c6b3f3280983588c0a.r2.cloudflarestorage.com",
              public_base_url="https://pub-b23db26935fa4d4ab0d1ef718ad541ec.r2.dev",
              max_bucket_bytes=9_000_000_000,
          )
          files = sorted(Path("review-audio").glob("ai-builder-brief_*.mp3"))
          if len(files) != 2:
              raise RuntimeError(f"expected two reviewed MP3s, found {len(files)}")
          for audio in files:
              print(publisher.publish(audio, f"episodes/{audio.name}"))
          PY
